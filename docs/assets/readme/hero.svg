  <text x="52" y="152" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="700">ComandaFácil</text>
  <text x="54" y="198" fill="#cbd5e1" font-family="DejaVu Sans, sans-serif" font-size="23">Do primeiro atendimento ao último fechamento.</text>
  <text x="54" y="232" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="17">Recepção · Mesas · Pedidos · Cozinha · Comandas</text>
