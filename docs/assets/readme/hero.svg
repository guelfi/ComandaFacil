<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ComandaFácil — do primeiro atendimento ao último fechamento</title>
  <desc id="desc">Banner em verde profundo e tons claros com uma comanda estilizada e três etapas: receber, atender e fechar.</desc>
  <rect width="1200" height="360" rx="24" fill="#143b33"/>
  <circle cx="1140" cy="42" r="200" fill="#dce9b8" fill-opacity=".04"/>
  <circle cx="1165" cy="42" r="145" fill="none" stroke="#dce9b8" stroke-opacity=".12"/>
