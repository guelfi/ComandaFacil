  <text x="78" y="76" fill="#dce9b8" font-family="DejaVu Sans, sans-serif" font-size="15" letter-spacing="3">GESTÃO QUE ACOMPANHA</text>
  <text x="52" y="152" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="700">ComandaFácil</text>
  <text x="54" y="198" fill="#e4ece6" font-family="DejaVu Sans, sans-serif" font-size="23">Do papel ao digital, gestão que acompanha.</text>
  <text x="54" y="232" fill="#b7cec6" font-family="DejaVu Sans, sans-serif" font-size="17">Comandas · Atendimento · Cardápio · Fidelidade</text>
